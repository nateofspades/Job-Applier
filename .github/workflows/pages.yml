name: Test and publish listings

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out public repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Check dataset consistency and public asset boundary
        run: npm test
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Exercise both pages under the GitHub project prefix
        shell: bash
        run: |
          set -euo pipefail
          preview_root="$(mktemp -d)"
          ln -s "$GITHUB_WORKSPACE/site" "$preview_root/Job-Applier"
          python3 -m http.server 18766 --bind 127.0.0.1 --directory "$preview_root" > "$RUNNER_TEMP/listings-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; rm -rf "$preview_root"' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:18766/Job-Applier/index.html > /dev/null
          PREVIEW_ORIGIN=http://127.0.0.1:18766/Job-Applier npm run test:browser

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out tested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload only public site assets
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
